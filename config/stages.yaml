# Per-stage configuration. Model diversity between Hunt and Validate is
# load-bearing: it implements the blog's "deliberate disagreement" rule.
# Trace runs on Opus because the paper calls it "the stage that matters most."

defaults:
  max_turns: 25
  permission_mode: acceptEdits   # never bypassPermissions
  repair_attempts: 1             # one re-emit chance on schema-validation failure

stages:
  recon:
    model: claude-opus-4-8
    concurrency: 1
    tools: [Read, Grep, Glob, Bash]  # Bash = read-only git history mining ONLY
    max_turns: 60                # recon can be long
    repair_attempts: 2           # critical one-shot; spend a second repair turn if needed
  hunt:
    model: claude-sonnet-5
    concurrency: 50
    tools: [Read, Grep, Glob, Bash]  # Bash = PoC execution, ACTIVE ONLY inside a sandbox (runner strips it on a bare host)
  validate:
    model: claude-opus-4-8        # different from hunt — deliberate disagreement
    concurrency: 10
    tools: [Read, Grep, Glob]     # no Bash: pure analysis
  gapfill:
    model: claude-sonnet-5
    concurrency: 1
    tools: [Read, Grep, Glob]
    repair_attempts: 2
  dedupe:
    model: claude-sonnet-5
    concurrency: 1
    tools: [Read]
  trace:
    model: claude-opus-4-8        # most critical stage
    concurrency: 10
    tools: [Read, Grep, Glob, Bash]
  feedback:
    model: claude-sonnet-5
    concurrency: 1
    tools: [Read, Grep, Glob]     # no Bash: the sweep only greps
    repair_attempts: 2
  chain:
    model: claude-sonnet-5        # report/grade tier — one synthesis pass
    concurrency: 1
    tools: [Read, Grep, Glob]       # read-only; never executes target code
  report:
    model: claude-sonnet-5
    concurrency: 1
    tools: [Read]
  remediate:
    # Decoupled, opt-in `vash remediate` (NOT part of the scan loop). Patch
    # generation is high-stakes -> strong model. Read-only tools ONLY: the
    # agent reads code and emits a unified diff + a security test as JSON; it
    # NEVER executes the target (static-first). No Bash, no Write.
    model: claude-opus-4-8
    concurrency: 4
    tools: [Read, Grep, Glob]
    repair_attempts: 2
  revalidate:
    # Decoupled, opt-in `vash validate` (NOT part of the scan loop; Phase 6).
    # A fresh, independent second opinion on findings the scan already
    # confirmed (VVAH s6 second-opinion stance) — deliberately a DIFFERENT
    # model tier than the scan's own `validate` stage (opus above) so the
    # "deliberate disagreement" pattern this file opens with extends across
    # the scan/second-opinion boundary, not just within the scan itself.
    # Read-only tools ONLY (no Bash, no Write): the agent reads code and
    # emits a verdict as JSON; it NEVER executes the target (static-first).
    # `--model` on the CLI overrides this default.
    model: claude-sonnet-5
    concurrency: 4
    tools: [Read, Grep, Glob]
    repair_attempts: 2

# Bounded loops to prevent runaway cost
loops:
  gapfill_iterations: 1     # max Hunt → Validate → Gapfill cycles
  feedback_iterations: 1    # one feedback pass after Trace
