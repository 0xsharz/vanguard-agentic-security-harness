[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vash"
version = "0.1.0"
description = "VASH (Vanguard Agentic Security Harness) — static-first Python vulnerability discovery agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "claude-agent-sdk>=0.0.20",
    "click>=8.1",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "graphifyy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
vash = "vash.cli:main"

[tool.setuptools.packages.find]
include = ["vash*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "bench"]
